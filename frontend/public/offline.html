<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1976D2" />
    <link rel="manifest" href="/manifest-mobile.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>PCHelper — нет соединения</title>
    <style>
      :root {
        --primary: #1976d2;
        --surface: #ffffff;
        --border: #e8e8e8;
        --text: #111111;
        --muted: #555555;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f5f5;
        color: var(--text);
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }
      .card {
        width: min(420px, 100%);
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        text-align: center;
      }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 14px;
        display: grid; place-items: center;
        border-radius: 14px; background: #e3f2fd; color: var(--primary);
        font-size: 28px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; font-size: 14px; }
      .btn {
        display: inline-block;
        min-height: 44px;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible, button:focus-visible {
        outline: 3px solid #fbc02d;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f141a; }
        .card { background: #171f28; border-color: #2a3542; color: #eef3f7; }
        .mark { background: #14324a; color: #64b5f6; }
        p { color: #b9c4cf; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">⚡</div>
      <h1>Нет соединения</h1>
      <p>
        Каталог и корзина временно недоступны без сети. Проверьте подключение
        и повторите попытку — сохранённые данные останутся на месте.
      </p>
      <a class="btn" href="/mobile.html">Вернуться в магазин</a>
    </main>
  </body>
</html>
